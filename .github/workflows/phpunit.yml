name: build

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
      - 'claude/debug-arm64-memory-corruption-JoXfw'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:

  phpunit-unit:
    name: phpunit (unit)
    if: ${{ !contains(github.ref, 'claude/debug-arm64-memory-corruption-JoXfw') && !contains(github.head_ref, 'claude/debug-arm64-memory-corruption-JoXfw') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP Action
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: ffi, dom, mbstring
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Setup Problem Matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run unit tests
        run: |
          mkdir -p build/logs
          vendor/bin/phpunit \
            --exclude-group target-version \
            --exclude-group frankenphp \
            --exclude-group mod_php \
            --coverage-clover build/logs/clover.xml

      - name: Send to coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          flag-name: unit
          parallel: true

  build-dev-image:
    name: Build dev image
    if: ${{ !contains(github.ref, 'claude/debug-arm64-memory-corruption-JoXfw') && !contains(github.head_ref, 'claude/debug-arm64-memory-corruption-JoXfw') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/dev
    steps:
      - uses: actions/checkout@v6

      - name: Compute Dockerfile hash
        id: hash
        run: echo "tag=sha-$(sha256sum Dockerfile-dev | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push dev image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-dev
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      image: ${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}

  build-test-mysql-images:
    name: Build PHP ${{ matrix.php_version }}+pdo_mysql
    if: ${{ !contains(github.ref, 'claude/debug-arm64-memory-corruption-JoXfw') && !contains(github.head_ref, 'claude/debug-arm64-memory-corruption-JoXfw') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php_version: ["7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/test-php-mysql
    steps:
      - uses: actions/checkout@v6

      - name: Compute Dockerfile hash
        id: hash
        run: echo "tag=php${{ matrix.php_version }}-sha-$(sha256sum Dockerfile-test-php-mysql | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-test-php-mysql
          push: true
          build-args: PHP_VERSION=${{ matrix.php_version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}
            ${{ env.IMAGE }}:php${{ matrix.php_version }}
          cache-from: type=gha,scope=test-php-mysql-${{ matrix.php_version }}
          cache-to: type=gha,mode=max,scope=test-php-mysql-${{ matrix.php_version }}

  phpunit-target-version:
    name: phpunit (${{ matrix.name }})
    if: ${{ !contains(github.ref, 'claude/debug-arm64-memory-corruption-JoXfw') && !contains(github.head_ref, 'claude/debug-arm64-memory-corruption-JoXfw') }}
    needs: [build-dev-image, build-test-mysql-images]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PHP 7.0"
            targets: "v70"
            php_minor: "7.0"
          - name: "PHP 7.1"
            targets: "v71"
            php_minor: "7.1"
          - name: "PHP 7.2"
            targets: "v72"
            php_minor: "7.2"
          - name: "PHP 7.3"
            targets: "v73"
            php_minor: "7.3"
          - name: "PHP 7.4"
            targets: "v74"
            php_minor: "7.4"
          - name: "PHP 8.0"
            targets: "v80"
            php_minor: "8.0"
          - name: "PHP 8.1"
            targets: "v81"
            php_minor: "8.1"
          - name: "PHP 8.2"
            targets: "v82"
            php_minor: "8.2"
          - name: "PHP 8.3"
            targets: "v83"
            php_minor: "8.3"
          - name: "PHP 8.4"
            targets: "v84"
            php_minor: "8.4"
          - name: "PHP 8.5"
            targets: "v85"
            php_minor: "8.5"
          - name: "PHP 7.3 ZTS"
            targets: "v73_zts"
            php_minor: "7.3"
          - name: "PHP 7.4 ZTS"
            targets: "v74_zts"
            php_minor: "7.4"
          - name: "PHP 8.0 ZTS"
            targets: "v80_zts"
            php_minor: "8.0"
          - name: "PHP 8.1 ZTS"
            targets: "v81_zts"
            php_minor: "8.1"
          - name: "PHP 8.2 ZTS"
            targets: "v82_zts"
            php_minor: "8.2"
          - name: "PHP 8.3 ZTS"
            targets: "v83_zts"
            php_minor: "8.3"
          - name: "PHP 8.4 ZTS"
            targets: "v84_zts"
            php_minor: "8.4"
          - name: "PHP 8.5 ZTS"
            targets: "v85_zts"
            php_minor: "8.5"
          - name: "PHP 8.4 Alpine"
            targets: "v84_alpine"
            php_minor: "8.4"
          - name: "PHP 8.4 Alpine ZTS"
            targets: "v84_alpine_zts"
            php_minor: "8.4"
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull dev image
        run: |
          docker pull ${{ needs.build-dev-image.outputs.image }}
          docker tag ${{ needs.build-dev-image.outputs.image }} reli-dev

      - name: Pull PHP+pdo_mysql test image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/test-php-mysql
        run: |
          docker pull "$IMAGE:php${{ matrix.php_minor }}" || true
          docker tag "$IMAGE:php${{ matrix.php_minor }}" "reli-test-php-mysql:${{ matrix.php_minor }}" 2>/dev/null || true

      - name: Restore target Docker image cache
        id: target-cache
        uses: actions/cache@v5
        with:
          path: /tmp/target-image.tar.gz
          key: docker-target-${{ matrix.targets }}

      - name: Load cached target Docker image
        if: steps.target-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/target-image.tar.gz

      - name: Install dependencies
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app reli-dev composer install --prefer-dist --no-progress --no-suggest

      - name: Pull MySQL image for pdo_mysql tests
        run: docker pull mysql:8.0

      - name: Enable core dumps
        run: |
          sudo mkdir -p /tmp/reli-test
          sudo chmod 1777 /tmp/reli-test
          sudo sysctl -w kernel.core_pattern='/tmp/reli-test/core.%e.%p.%t'
          # Disable apport so it doesn't swallow cores.
          sudo systemctl stop apport.service 2>/dev/null || true

      - name: Run target version tests
        env:
          RELI_TEST_PHP_TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p build/logs
          docker compose run reli-test-for-ci vendor/bin/phpunit --group target-version --coverage-clover build/logs/clover.xml

      - name: Upload test trace log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reli-test-trace-${{ matrix.targets }}
          path: /tmp/reli-test/reli-test-trace.log
          if-no-files-found: ignore

      - name: Collect crash diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/reli-crash
          sudo cp /tmp/reli-test/core.* /tmp/reli-crash/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/reli-crash || true
          sudo dmesg -T > /tmp/reli-crash/dmesg.log 2>/dev/null || true
          ls -la /tmp/reli-crash/ || true

      - name: Upload crash diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reli-crash-${{ matrix.targets }}
          path: /tmp/reli-crash/
          if-no-files-found: ignore

      - name: Fix coverage paths from Docker container
        run: sed -i 's|/app/|${{ github.workspace }}/|g' build/logs/clover.xml

      - name: Send to coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          flag-name: ${{ matrix.targets }}
          parallel: true

      - name: Save target Docker image for cache
        if: steps.target-cache.outputs.cache-hit != 'true'
        run: |
          TARGET_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^php:' | head -1)
          if [ -n "$TARGET_IMAGE" ]; then
            docker save "$TARGET_IMAGE" | gzip > /tmp/target-image.tar.gz
          fi

  phpunit-frankenphp:
    name: phpunit (FrankenPHP)
    if: ${{ !contains(github.ref, 'claude/debug-arm64-memory-corruption-JoXfw') && !contains(github.head_ref, 'claude/debug-arm64-memory-corruption-JoXfw') }}
    needs: build-dev-image
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull dev image
        run: |
          docker pull ${{ needs.build-dev-image.outputs.image }}
          docker tag ${{ needs.build-dev-image.outputs.image }} reli-dev

      - name: Pull FrankenPHP image
        run: docker pull dunglas/frankenphp:php8.4

      - name: Install dependencies
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app reli-dev composer install --prefer-dist --no-progress --no-suggest

      - name: Run FrankenPHP tests
        run: |
          mkdir -p /tmp/reli-test
          docker compose run reli-test-for-ci vendor/bin/phpunit --group frankenphp --no-coverage

  build-dev-image-arm64:
    name: Build dev image (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/dev
    steps:
      - uses: actions/checkout@v6

      - name: Compute Dockerfile hash
        id: hash
        run: echo "tag=sha-$(sha256sum Dockerfile-dev | cut -c1-16)-arm64" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push dev image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-dev
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}
            ${{ env.IMAGE }}:latest-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
    outputs:
      image: ${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}

  phpunit-unit-arm64:
    name: phpunit (unit, ARM64)
    if: ${{ !contains(github.ref, 'claude/debug-arm64-memory-corruption-JoXfw') && !contains(github.head_ref, 'claude/debug-arm64-memory-corruption-JoXfw') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP Action
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: ffi, dom, mbstring
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run unit tests
        run: |
          mkdir -p build/logs
          vendor/bin/phpunit \
            --exclude-group target-version \
            --exclude-group frankenphp \
            --exclude-group mod_php \
            --coverage-clover build/logs/clover.xml

      - name: Send to coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          flag-name: unit-arm64
          parallel: true

  build-test-mysql-images-arm64:
    name: Build PHP ${{ matrix.php_version }}+pdo_mysql (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Debug branch: only the version we test (v84). The other side
        # images aren't needed since the target-version matrix is trimmed.
        php_version: ["8.4"]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/test-php-mysql
    steps:
      - uses: actions/checkout@v6

      - name: Compute Dockerfile hash
        id: hash
        run: echo "tag=php${{ matrix.php_version }}-sha-$(sha256sum Dockerfile-test-php-mysql | cut -c1-16)-arm64" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-test-php-mysql
          push: true
          build-args: PHP_VERSION=${{ matrix.php_version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.hash.outputs.tag }}
            ${{ env.IMAGE }}:php${{ matrix.php_version }}-arm64
          cache-from: type=gha,scope=test-php-mysql-${{ matrix.php_version }}-arm64
          cache-to: type=gha,mode=max,scope=test-php-mysql-${{ matrix.php_version }}-arm64

  phpunit-target-version-arm64:
    name: phpunit (${{ matrix.name }}, ARM64)
    needs: [build-dev-image-arm64, build-test-mysql-images-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debug branch: A/B-test the parsed-resolver-share root cause in
          # one CI run. All entries hit the same v84 target so they share
          # the docker image cache.
          #
          # bytes-share : control. matches the merged #676 behaviour. green.
          # parsed-share-on : RELI_DEBUG_FORCE_PARSED_RESOLVER_SHARE=1 reintroduces
          #     the broken path. Expected to reproduce zend_mm_heap corrupted.
          # parsed-share-on-noalloc : same + USE_ZEND_ALLOC=0 forces PHP to
          #     use system malloc, which bypasses zend_mm bookkeeping.
          #     If GREEN here, the corruption is purely a zend_mm
          #     bookkeeping issue triggered by the deep object graph.
          #     If still RED, it's a real heap write somewhere.
          # parsed-share-on-valgrind : same + valgrind catches the actual
          #     bad write. Slow (~10x) but gives a usable backtrace.
          - name: "PHP 8.4 bytes-share"
            targets: "v84"
            php_minor: "8.4"
            tag: "bytes-share"
            force_parsed: "0"
            use_zend_alloc: ""
            valgrind: "0"
          - name: "PHP 8.4 parsed-share-on"
            targets: "v84"
            php_minor: "8.4"
            tag: "parsed-share-on"
            force_parsed: "1"
            use_zend_alloc: ""
            valgrind: "0"
          - name: "PHP 8.4 parsed-share-on-noalloc"
            targets: "v84"
            php_minor: "8.4"
            tag: "parsed-share-on-noalloc"
            force_parsed: "1"
            use_zend_alloc: "0"
            valgrind: "0"
          - name: "PHP 8.4 parsed-share-on-valgrind"
            targets: "v84"
            php_minor: "8.4"
            tag: "parsed-share-on-valgrind"
            force_parsed: "1"
            use_zend_alloc: "0"
            valgrind: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull dev image
        run: |
          docker pull ${{ needs.build-dev-image-arm64.outputs.image }}
          docker tag ${{ needs.build-dev-image-arm64.outputs.image }} reli-dev

      - name: Pull PHP+pdo_mysql test image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/test-php-mysql
        run: |
          docker pull "$IMAGE:php${{ matrix.php_minor }}-arm64" || true
          docker tag "$IMAGE:php${{ matrix.php_minor }}-arm64" "reli-test-php-mysql:${{ matrix.php_minor }}" 2>/dev/null || true

      - name: Restore target Docker image cache
        id: target-cache
        uses: actions/cache@v5
        with:
          path: /tmp/target-image.tar.gz
          key: docker-target-arm64-${{ matrix.targets }}

      - name: Load cached target Docker image
        if: steps.target-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/target-image.tar.gz

      - name: Install dependencies
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app reli-dev composer install --prefer-dist --no-progress --no-suggest

      - name: Pull MySQL image for pdo_mysql tests
        run: docker pull mysql:8.0

      - name: Enable core dumps
        run: |
          sudo mkdir -p /tmp/reli-test
          sudo chmod 1777 /tmp/reli-test
          sudo sysctl -w kernel.core_pattern='/tmp/reli-test/core.%e.%p.%t'
          sudo systemctl stop apport.service 2>/dev/null || true

      - name: Install valgrind in dev image (debug branch only)
        if: matrix.valgrind == '1'
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app reli-dev bash -c "apt-get update && apt-get install -y valgrind && valgrind --version" || true
          # Bake an updated image so docker compose run picks it up.
          CID=$(docker run -d -v ${{ github.workspace }}:/app -w /app reli-dev sleep 30)
          docker exec "$CID" bash -c "apt-get update && apt-get install -y --no-install-recommends valgrind"
          docker commit "$CID" reli-dev
          docker rm -f "$CID"
          docker run --rm reli-dev valgrind --version

      - name: Run target version tests
        env:
          RELI_TEST_PHP_TARGETS: ${{ matrix.targets }}
          RELI_DEBUG_RESOLVER_SHARE: "1"
          RELI_DEBUG_FORCE_PARSED_RESOLVER_SHARE: ${{ matrix.force_parsed }}
          USE_ZEND_ALLOC: ${{ matrix.use_zend_alloc }}
        run: |
          mkdir -p build/logs
          if [ "${{ matrix.valgrind }}" = "1" ]; then
            # valgrind catches the actual write that corrupts the heap.
            # USE_ZEND_ALLOC=0 is required so PHP uses system malloc, which
            # valgrind can track; otherwise zend_mm's bump allocator hides
            # everything behind one big mmap region.
            #
            # --error-exitcode=0 keeps phpunit's own exit code authoritative
            # so we still see the test report, while the valgrind log goes
            # to the artifact for analysis.
            docker compose run reli-test-for-ci bash -c "
              valgrind \
                --error-exitcode=0 \
                --log-file=/tmp/reli-test/valgrind-${{ matrix.tag }}-%p.log \
                --num-callers=40 \
                --tool=memcheck \
                --leak-check=no \
                --track-origins=yes \
                vendor/bin/phpunit \
                  --group target-version \
                  --filter 'MemoryDumpCommandTest|MemoryCompareCommandIntegrationTest' \
                  --coverage-clover build/logs/clover.xml
            " || true
          else
            docker compose run reli-test-for-ci vendor/bin/phpunit --group target-version --coverage-clover build/logs/clover.xml
          fi

      - name: Dump resolver-share log tail to job output
        if: always()
        run: |
          echo "=== resolver-share log files ==="
          ls -la /tmp/reli-test/resolver-share-*.log 2>&1 || true
          echo "=== summary by event tag ==="
          for f in /tmp/reli-test/resolver-share-*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            grep -oE '\] [a-z._]+' "$f" | sort | uniq -c | sort -rn || true
          done
          echo "=== first 60 + last 60 lines of largest log ==="
          biggest=$(ls -S /tmp/reli-test/resolver-share-*.log 2>/dev/null | head -1)
          if [ -n "$biggest" ]; then
            echo ">>> head $biggest"
            head -60 "$biggest" || true
            echo ">>> tail $biggest"
            tail -60 "$biggest" || true
          fi

      - name: Upload test trace log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reli-test-trace-${{ matrix.targets }}-${{ matrix.tag }}-arm64
          path: /tmp/reli-test/reli-test-trace.log
          if-no-files-found: ignore

      - name: Upload resolver-share debug log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reli-resolver-share-${{ matrix.targets }}-${{ matrix.tag }}-arm64
          path: /tmp/reli-test/resolver-share*.log
          if-no-files-found: ignore

      - name: Upload valgrind log
        if: always() && matrix.valgrind == '1'
        uses: actions/upload-artifact@v7
        with:
          name: reli-valgrind-${{ matrix.targets }}-${{ matrix.tag }}-arm64
          path: /tmp/reli-test/valgrind-*.log
          if-no-files-found: ignore

      - name: Collect crash diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/reli-crash
          sudo cp /tmp/reli-test/core.* /tmp/reli-crash/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/reli-crash || true
          sudo dmesg -T > /tmp/reli-crash/dmesg.log 2>/dev/null || true
          ls -la /tmp/reli-crash/ || true

      - name: Upload crash diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reli-crash-${{ matrix.targets }}-${{ matrix.tag }}-arm64
          path: /tmp/reli-crash/
          if-no-files-found: ignore

      - name: Fix coverage paths from Docker container
        run: sed -i 's|/app/|${{ github.workspace }}/|g' build/logs/clover.xml

      - name: Send to coveralls
        if: matrix.tag == 'bytes-share'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          flag-name: ${{ matrix.targets }}-${{ matrix.tag }}-arm64
          parallel: true

      - name: Save target Docker image for cache
        if: steps.target-cache.outputs.cache-hit != 'true' && matrix.tag == 'bytes-share'
        run: |
          TARGET_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^php:' | head -1)
          if [ -n "$TARGET_IMAGE" ]; then
            docker save "$TARGET_IMAGE" | gzip > /tmp/target-image.tar.gz
          fi

  coveralls-finish:
    name: Coveralls finish
    needs: [phpunit-unit, phpunit-unit-arm64, phpunit-target-version, phpunit-target-version-arm64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finish parallel build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
