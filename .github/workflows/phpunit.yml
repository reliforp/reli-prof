name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:

  phpunit-test:
    name: phpunit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PHP 7.x"
            targets: "v70,v71,v72,v73,v74"
            coverage: false
          - name: "PHP 8.0-8.2"
            targets: "v80,v81,v82"
            coverage: false
          - name: "PHP 8.3-8.4"
            targets: "v83,v84"
            coverage: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP Action
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: ffi, dom, mbstring
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ matrix.targets }}-${{ hashFiles('Dockerfile-dev','tests/TargetPhpVmProvider.php') }}

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Setup Problem Matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run test suite
        env:
          RELI_TEST_PHP_TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p build/logs
          composer test-for-ci

      - name: Fix absolute paths in the coverage report
        if: matrix.coverage
        run: sed -i "s|<file name=\"/app/|<file name=\"`pwd`/|g" build/logs/clover.xml

      - name: Send to coveralls
        if: matrix.coverage
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./vendor/bin/php-coveralls -v
